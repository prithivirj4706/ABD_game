<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlipStack: Infection Protocol</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const err = document.createElement('div');
      err.style.color = 'red';
      err.style.position = 'absolute';
      err.style.top = '10px';
      err.style.left = '10px';
      err.style.zIndex = '9999';
      err.style.backgroundColor = 'rgba(0,0,0,0.8)';
      err.style.padding = '10px';
      err.style.fontFamily = 'monospace';
      err.style.whiteSpace = 'pre-wrap';
      err.innerText = `Error: ${message}\nLine: ${lineno}:${colno}\nStack:\n${error ? error.stack : ''}`;
      document.body.appendChild(err);
      fetch('http://localhost:8081', { method: 'POST', body: 'ERROR: ' + message });
    };
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      fetch('http://localhost:8081', { method: 'POST', body: 'LOG: ' + args.join(' ') }).catch(e => {});
    };
  </script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ECA1A1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-layer">
      <!-- Top Icons, visible on Menu and partially on Game Over -->
      <div id="top-icons">
        <div class="left-icons">
          <i class="fas fa-cog icon-btn" id="btn-settings"></i>
          <i class="fas fa-trophy icon-btn" id="btn-leaderboard"></i>
          <div class="gift-icon-container">
             <i class="fas fa-gift icon-btn gift"></i>
             <i class="fas fa-video video-badge"></i>
             <div class="gift-text">+50 <i class="fas fa-gem gem-small"></i></div>
          </div>
          <i class="fas fa-palette icon-btn"></i>
        </div>
        <div class="right-icons">
          <div class="diamonds">0 <i class="fas fa-gem"></i></div>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div id="mode-indicator"></div>
        <div id="score">0</div>
        <div id="best-score-container">BEST: <span id="best-score">0</span></div>
      </div>
      
      <!-- Modals -->
      <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
          <h3>SETTINGS</h3>
          <div class="setting-row">
            <label>Master Volume</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7">
          </div>
          <button class="close-btn" id="close-settings">CLOSE</button>
        </div>
      </div>

      <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content">
          <h3>GLOBAL TOP 10</h3>
          <div id="leaderboard-list">
            <!-- Populated by JS -->
            <div class="loading">Loading connection...</div>
          </div>
          <button class="close-btn" id="close-leaderboard">CLOSE</button>
        </div>
      </div>
      
      <div id="menu-scene" class="scene">
        <h1>STACK<br/>GAME</h1>
        <div class="tap-to-play">Tap to play</div>
      </div>
      
      <div id="game-over-scene" class="scene hidden">
        <h2>SYSTEM FAILURE</h2>
        <div class="stats">
          SCORE: <span id="final-score">0</span>
        </div>
        <div class="tap-to-play">Tap to REBOOT</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { GameEngine } from './src/core/GameEngine.js';
    import { UIManager } from './src/ui/UIManager.js';
    import { MenuScene } from './src/ui/MenuScene.js';
    import { GameOverScene } from './src/ui/GameOverScene.js';
    
    const init = () => {
      const canvas = document.getElementById('game-canvas');
      const engine = new GameEngine(canvas);
      window.gameEngine = engine;
      
      const ui = new UIManager(engine);
      const menu = new MenuScene(engine);
      const gameOver = new GameOverScene(engine);
      
      engine.start();
      
      window.addEventListener('game:start', () => {
        document.getElementById('hud').classList.remove('hidden');
      });
      
      window.addEventListener('game:gameover', () => {
        document.getElementById('hud').classList.add('hidden');
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
